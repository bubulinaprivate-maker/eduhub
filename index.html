<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      background: #f7f7f9;
      line-height: 1.6;
    }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 700; font-size: 1.2rem; }
    nav a { margin-left: 16px; color: #555; text-decoration: none; }
    nav a:hover { color: #000; }
    .hero { text-align: center; padding: 80px 0; }
    .hero h1 { font-size: 3rem; margin-bottom: 12px; }
    .hero p { color: #555; margin-bottom: 24px; }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
    }
    .button:hover { background: #1d4ed8; }
    footer { text-align: center; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">EduHub</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Hello, World!</h1>
      <p>Welcome to my first landing page.</p>
      <a class="button" href="#">Get Started</a>
    </section>
  </main>

  <footer>&copy; 2026 EduHub</footer>
</body>
</html>
